name: Daily Update Recent Data (Piezometer & Rainfall)

on:
  schedule:
    # Setiap hari jam 23:00 WIB (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: daily-update-recent
  cancel-in-progress: false

jobs:
  update-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-save --no-audit --no-fund pg dotenv

      - name: Run Piezometer & Rainfall Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/update-recent.mjs
