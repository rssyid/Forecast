name: IoT TMAT Accuracy Ingest

on:
  schedule:
    # Setiap Kamis pagi pukul 07:00 WIB (00:00 UTC)
    - cron: '0 0 * * 4'
  workflow_dispatch:
    inputs:
      coverage:
        description: 'Coverage target (all atau 1 coverage)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - Kalbar A
          - Kalbar B
          - Papua
          - Region 1 Non THIP
          - Region 1 THIP
          - Region 2 Non THIP
          - Region 2 THIP
      week_label:
        description: 'Target Week label dari calendar_weeks (misal Nov 2026, W4; kosong = week berjalan)'
        required: false
        default: ''
        type: string
      date_from:
        description: 'Tanggal awal YYYY-MM-DD (opsional, default 30 hari WIB)'
        required: false
        default: ''
        type: string
      date_to:
        description: 'Tanggal akhir YYYY-MM-DD (opsional, default akhir week / hari ini WIB)'
        required: false
        default: ''
        type: string
      trigger_source:
        description: 'Sumber pemicu workflow'
        required: false
        default: 'manual'
        type: choice
        options:
          - manual
          - schedule

concurrency:
  group: iot-tmat-ingest
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      run_id: ${{ steps.meta.outputs.run_id }}
      date_from: ${{ steps.meta.outputs.date_from }}
      date_to: ${{ steps.meta.outputs.date_to }}
      week_name: ${{ steps.meta.outputs.week_name }}
      week_label: ${{ steps.meta.outputs.week_label }}
      week_start: ${{ steps.meta.outputs.week_start }}
      week_end: ${{ steps.meta.outputs.week_end }}
      trigger_source: ${{ steps.meta.outputs.trigger_source }}
      coverages: ${{ steps.meta.outputs.coverages }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Ensure accuracy schema
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run db:migrate:accuracy

      - name: Resolve week metadata, WIB date range, and matrix
        id: meta
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INPUT_COV: ${{ github.event.inputs.coverage }}
          INPUT_WEEK: ${{ github.event.inputs.week_label }}
          INPUT_FROM: ${{ github.event.inputs.date_from }}
          INPUT_TO: ${{ github.event.inputs.date_to }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE: ${{ github.event.inputs.trigger_source }}
        run: |
          SOURCE="${INPUT_SOURCE:-manual}"
          if [ "$EVENT_NAME" = "schedule" ]; then
            SOURCE="schedule"
          fi
          npx tsx worker/ingest.ts \
            --mode=prepare \
            --run-id="gha-${{ github.run_id }}-${{ github.run_attempt }}" \
            --coverage="${INPUT_COV:-all}" \
            --week-label="${INPUT_WEEK}" \
            --from="${INPUT_FROM}" \
            --to="${INPUT_TO}" \
            --trigger-source="${SOURCE}"

  ingest:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        coverage: ${{ fromJson(needs.prepare.outputs.coverages) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Fetch, analyze, and persist coverage
        env:
          PORTAL_USERNAME: ${{ secrets.PORTAL_USERNAME }}
          PORTAL_PASSWORD: ${{ secrets.PORTAL_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          npx tsx worker/ingest.ts
          --mode=ingest
          --coverage="${{ matrix.coverage }}"
          --run-id="${{ needs.prepare.outputs.run_id }}"
          --from="${{ needs.prepare.outputs.date_from }}"
          --to="${{ needs.prepare.outputs.date_to }}"
          --week-name="${{ needs.prepare.outputs.week_name }}"
          --week-label="${{ needs.prepare.outputs.week_label }}"
          --week-start="${{ needs.prepare.outputs.week_start }}"
          --week-end="${{ needs.prepare.outputs.week_end }}"
          --trigger-source="${{ needs.prepare.outputs.trigger_source }}"

  finalize:
    needs: [prepare, ingest]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Summarize run status and prune old time-series
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: >
          npx tsx worker/ingest.ts
          --mode=finalize
          --run-id="${{ needs.prepare.outputs.run_id }}"
          --retain-weeks=12
