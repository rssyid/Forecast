name: ECMWF Forecast Download

on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: 'Forecast date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * 3'

jobs:
  download-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install ecmwf-opendata xarray cfgrib geopandas shapely pandas

      - name: Determine forecast date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.forecast_date }}" ]; then
            echo "FORECAST_DATE=${{ github.event.inputs.forecast_date }}" >> $GITHUB_OUTPUT
          else
            # Get current Wednesday (or most recent)
            FORECAST_DATE=$(python -c "
from datetime import datetime, timedelta
today = datetime.utcnow().date()
days_since_wed = (today.weekday() - 2) % 7
wed = today - timedelta(days=days_since_wed)
print(wed.strftime('%Y-%m-%d'))
")
            echo "FORECAST_DATE=$FORECAST_DATE" >> $GITHUB_OUTPUT
          fi
          echo "Using forecast date: $(cat $GITHUB_OUTPUT | grep FORECAST_DATE)"

      - name: Download and process ECMWF data
        run: |
          python scripts/download_ecmwf.py --date ${{ steps.date.outputs.FORECAST_DATE }} > /tmp/ecmwf_output.geojson

      - name: Upload to Vercel API
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          ECMWF_API_SECRET: ${{ secrets.ECMWF_API_SECRET }}
        run: |
          FORECAST_DATE="${{ steps.date.outputs.FORECAST_DATE }}"
          
          # Build JSON payload to a file (avoids shell escaping issues with large JSON)
          python -c "
          import json
          with open('/tmp/ecmwf_output.geojson', 'r') as f:
              geojson = json.load(f)
          payload = {
              'date': '${FORECAST_DATE}',
              'geojson': geojson,
              'processing_time_sec': 0
          }
          with open('/tmp/ecmwf_payload.json', 'w') as f:
              json.dump(payload, f)
          print(f'Payload size: {len(json.dumps(payload))} bytes')
          print(f'Features: {len(geojson.get(\"features\", []))}')
          "
          
          # POST to Vercel API using file-based upload
          HTTP_CODE=$(curl -s -o /tmp/ecmwf_response.json -w "%{http_code}" \
            -X POST "${VERCEL_APP_URL}/api/ecmwf-forecast" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${ECMWF_API_SECRET}" \
            --data-binary @/tmp/ecmwf_payload.json)
          
          echo "Response status: $HTTP_CODE"
          cat /tmp/ecmwf_response.json
          
          if [ "$HTTP_CODE" != "200" ]; then
            echo "ERROR: Upload failed with status $HTTP_CODE"
            exit 1
          fi
          
          echo "✅ Data successfully uploaded for $FORECAST_DATE"
