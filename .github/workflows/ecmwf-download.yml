name: ECMWF Forecast Download

on:
  workflow_dispatch:
    inputs:
      forecast_date:
        description: 'Forecast date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string
  schedule:
    - cron: '0 0 * * 3'

jobs:
  download-and-process:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install system & Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-tools libeccodes-dev
          pip install -r requirements.txt

      - name: Determine forecast date
        id: date
        run: |
          if [ -n "${{ github.event.inputs.forecast_date }}" ]; then
            echo "FORECAST_DATE=${{ github.event.inputs.forecast_date }}" >> $GITHUB_OUTPUT
          else
            FORECAST_DATE=$(python -c "from datetime import datetime, timedelta; today = datetime.utcnow().date(); wed = today - timedelta(days=(today.weekday() - 2) % 7); print(wed.strftime('%Y-%m-%d'))")
            echo "FORECAST_DATE=$FORECAST_DATE" >> $GITHUB_OUTPUT
          fi
          echo "Using forecast date: $(grep FORECAST_DATE $GITHUB_OUTPUT)"

      - name: Download, process and upload to Vercel
        env:
          VERCEL_APP_URL: ${{ secrets.VERCEL_APP_URL }}
          ECMWF_API_SECRET: ${{ secrets.ECMWF_API_SECRET }}
        run: |
          python scripts/download_ecmwf.py --date ${{ steps.date.outputs.FORECAST_DATE }} --upload
