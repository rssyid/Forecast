name: Daily Update Recent Data (Piezometer & Rainfall)

on:
  schedule:
    # Setiap hari jam 23:00 WIB (16:00 UTC)
    - cron: '0 16 * * *'
  workflow_dispatch:

concurrency:
  group: daily-update-recent
  cancel-in-progress: false

jobs:
  update-recent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Piezometer & Rainfall Sync
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node scripts/update-recent.mjs
